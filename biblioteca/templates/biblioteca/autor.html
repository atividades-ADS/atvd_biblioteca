<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autor</title>
</head>
<body>
    <h1>Autor: {{ author.name }}</h1>
    <ul id="lista">
        {% for book in books %}
            <li>
                titulo: {{ book.title }} /
                ano: {{ book.year }}.
            </li>
        {% endfor %}
    </ul>
</body>
</html>
