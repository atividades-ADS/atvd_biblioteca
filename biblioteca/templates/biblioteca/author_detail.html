<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Livros</title>
</head>
<body>
    <h1>{{ author }}</h1>
    <p>Nacionalidade: {{ author.nationality }}</p>

    <p>Lista de Livros:</p>
    <ul id="lista">
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} - {{ livro.ano_publicacao }}.
            </li>
        {% endfor %}
    </ul>
</body>
</html>
