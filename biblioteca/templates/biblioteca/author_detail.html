<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Livros</title>
</head>
<body>
    <a href="{% url 'listar_livros' %}"><button>⬅️ Voltar</button></a>
    <h1>{{ author }}</h1>
    <p>Nacionalidade: {{ authors.nationality }}</p>

    <p>Lista de Livros:</p>
    <ul id="lista">
        {% for livro in author.books.all %}
            <li>
                {% if livro.capa %}
                    <img src="{{ livro.capa.url }}" alt="{{ livro.titulo }}" width="80px">
                {% endif %}
                {{ livro.titulo }} - {{ livro.ano_publicacao }}.
                <a href="{% url 'livro_edit_author' livro.id author.id %}"><button>Editar</button></a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
