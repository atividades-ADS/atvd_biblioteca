<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Livros</title>
</head>
<body>
    <a href="{% url 'create_author' %}"><button>➕ Novo Autor</button></a>
    <h1>Lista de Livros</h1>
    <ul id="lista">
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} - <a href="{% url 'details_author' livro.author.id %}">{{ livro.author }}</a>.
                {{ livro.ano_publicacao }}.
            </li>
        {% endfor %}
    </ul>
</body>
</html>
