<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Livros</title>
</head>
<body>
    <a href="{% url 'create_author' %}"><button>➕ Novo Autor</button></a>
    <a href="{% url 'livro_create' %}"><button>➕ Novo Livro</button></a>
    <a href="{% url 'sobre' %}"><button>👤 Sobre</button></a>
    <div style="display: flex; gap: 16px;">
        <h2>Total de Livros: {{ total_livros }}</h2>
        <h2>Disponíveis: {{ total_livros_disponivels }}</h2>
    </div>
    <h1>Lista de Livros</h1>
    <ul id="lista">
        {% for livro in livros %}
            <li>
                {% if livro.capa %}
                    <img src="{{ livro.capa.url }}" alt="{{ livro.titulo }}" width="80px" height="80px">
                {% endif %}
                {{ livro.titulo }} -
                {% for author in livro.authors.all %}
                    <a href="{% url 'details_author' author.id %}">{{ author }}</a>
                {% endfor %}.

                {{ livro.ano_publicacao }}.
                <a href="{% url 'livro_edit' livro.id %}"><button>Editar</button></a>
                <a href="{% url 'livro_delete' livro.id %}"><button>Exlcuir</button></a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
