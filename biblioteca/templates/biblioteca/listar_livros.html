<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Livros</title>
</head>
<body>
    <a href="{% url 'create_author' %}"><button>➕ Novo Autor</button></a>
    <a href="{% url 'livro_create' %}"><button>➕ Novo Livro</button></a>
    <h1>Lista de Livros</h1>
    <ul id="lista">
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} -
                {% for author in livro.authors.all %}
                    <a href="{% url 'details_author' author.id %}">{{ author }}</a>
                {% endfor %}.

                {{ livro.ano_publicacao }}.
                <a href="{% url 'livro_edit' livro.id %}">Editar</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
